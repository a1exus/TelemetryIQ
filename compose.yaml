# TelemetryIQ — Docker Compose
# Requires Linux host (e.g. Raspberry Pi). Docker Desktop on macOS does not
# support true host networking — the container runs in a VM and cannot receive
# UDP from external devices like the PS5. Use a Linux machine on the same LAN.
# PlayStation and host must be on the same network.
volumes:
  telemetry_data:

services:
  telemetryiq:
    build: .
    image: telemetryiq:latest
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - telemetry_data:/data
    restart: unless-stopped
