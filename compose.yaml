# GT7 telemetry — Docker Compose
# PlayStation and host must be on the same network; use host network so the
# container can discover the console via UDP/broadcast.
services:
  gt7:
    build: .
    image: gt7:latest
    # Use host network so gt-telem can discover the PlayStation on the LAN
    network_mode: host
    # Optional: pass through env (e.g. for config)
    # environment:
    #   - GT7_HEARTBEAT_TYPE=B
    # Restart policy (optional)
    restart: unless-stopped
